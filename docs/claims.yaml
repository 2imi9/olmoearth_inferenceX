  status: rejected
  experiments: [exp49]
  artifacts: [exp/out/exp49_summary.json]
  check: |-
    (lambda s:
      s['prereg'] == {'supported': True, 'complete': True}
      and (s['results']['v1_2']['bolivia']['tests']['ensemble mutual information']['w'], s['results']['v1_2']['bolivia']['tests']['ensemble mutual information']['l']) == (263, 61)
      and (s['results']['v1_2']['test']['tests']['ensemble mutual information']['w'], s['results']['v1_2']['test']['tests']['ensemble mutual information']['l']) == (352, 76)
      and round(s['results']['v1_2']['bolivia']['tests']['ensemble mutual information']['pooled_lead'], 4) == 0.0060 and round(s['results']['v1_2']['test']['tests']['ensemble mutual information']['pooled_lead'], 4) == 0.0022
      and all(0.03 <= round(s['results'][v][n]['tests']['embedding NCDD']['pooled_lead'], 2) <= 0.08 for v in ('v1', 'v1_2') for n in ('bolivia', 'test'))
