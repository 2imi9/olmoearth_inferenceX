    - {file: docs/TECHNIQUES.md, marker: atlas-disagreement-is-boundary-located}
    - {file: docs/results/comparisons.md, marker: atlas-disagreement-is-boundary-located}

- id: atlas-different-differences
  statement: "The sensor difference and the backbone difference are different sets of windows: phi between the S2-vs-S1 and the v1-vs-v1.2 disagreement masks is 0.27 on Bolivia and 0.18 on the test split, below 0.5 on 257 of 327 and 386 of 489 tiles (one-sided sign tests p < 1e-25; preregistered P2), and every pair of the four Sen1Floods11 disagreement sets overlaps at phi 0.18 to 0.41."
  status: supported
  experiments: [exp57]
  artifacts: [exp/out/exp57_summary.json]
  check: |-
    (lambda s, sb, cp:
      s['prereg']['P2'] is True
      and all(sb[t]['pooled_phi'] < 0.5 and sb[t]['sign_p'] < 1e-25 for t in ('bolivia', 'test'))
      and round(sb['bolivia']['pooled_phi'], 2) == 0.27 and round(sb['test']['pooled_phi'], 2) == 0.18
      and (sb['bolivia']['tiles_below'], sb['bolivia']['n_tiles_defined']) == (257, 327)
      and (sb['test']['tiles_below'], sb['test']['n_tiles_defined']) == (386, 489)
      and all(cp[t]['names'] == ['offsets 0 vs 2', 'backbones', 'sensors', 'finetune'] for t in ('bolivia', 'test'))
      and all(0.18 <= cp[t]['phi'][i][j] <= 0.42 for t in ('bolivia', 'test') for i in range(4) for j in range(4) if i != j)
      and round(min(cp[t]['phi'][i][j] for t in ('bolivia', 'test') for i in range(4) for j in range(4) if i != j), 2) == 0.18
      and round(max(cp[t]['phi'][i][j] for t in ('bolivia', 'test') for i in range(4) for j in range(4) if i != j), 2) == 0.41
    )(A['exp/out/exp57_summary.json'], A['exp/out/exp57_summary.json']['results']['cross_pairs']['sensors_vs_backbones'], A['exp/out/exp57_summary.json']['results']['cross_pairs'])
  cited_in:
