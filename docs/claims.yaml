- id: fine-tuned-model-audit
  statement: The replica of the fine-tuned AWF model reproduces the reported accuracy (0.881 vs 0.895) on the 344 validation points with 41 errors; confidence ranks its errors best (AURC 0.0262), tiling instability is indistinguishable (0.0235, CI spans zero), everything else is significantly worse, and it is overconfident (ECE 0.080).
  status: supported
  experiments: [exp21]
  artifacts: [exp/out/exp21_summary.json]
  check: |-
    (lambda c, b:
      round(c['accuracy'], 3) == 0.881 and c['n_errors'] == 41
      and round(c['aurc']['confidence (neg logit margin)'], 4) == 0.0262 and round(c['aurc']['tiling instability (aligned)'], 4) == 0.0235
      and b['tiling instability (aligned)'][0] < 0 < b['tiling instability (aligned)'][1]
      and all(b[k][0] > 0 for k in ('boundary indicator', 'probe disagreement', 'control (NDVI temporal std)'))
      and round(c['ece_10bins'], 3) == 0.080
    )(A['exp/out/exp21_summary.json']['crops']['16'], A['exp/out/exp21_summary.json']['crops']['16']['bootstrap_vs_confidence (lo, hi, P(signal better))'])
  cited_in:
    - {file: docs/Findings.md, marker: fine-tuned-model-audit}
    - {file: docs/TECHNIQUES.md, marker: fine-tuned-model-audit}
    - {file: docs/results/comparisons.md, marker: fine-tuned-model-audit}

