- id: modality-dominates-shared-errors
  statement: Reading Sentinel-1 instead of Sentinel-2 moves the error set far more (phi 0.38-0.39) than swapping the backbone (0.70), a two-layer or 3x3 head barely beats a backbone swap and stays far from fine-tuning's 0.475, and label impurity and chip clustering do not explain the overlap; the sensor is the largest lever and the backbone the smallest.
