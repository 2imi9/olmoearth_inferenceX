- id: s1-probe-ndwi-flip
  statement: Under the Sentinel-1 probe the no-model NDWI index beats the probe's own confidence on the multi-region test split under both backbones and on Ai2's own embeddings, and loses on Bolivia, the mirror image of the S2 head's Bolivia exception.
  status: measured
  experiments: [exp51]
  artifacts: [exp/out/exp51_summary.json]
  check: |-
    (lambda s:
      all(s['results'][a]['test']['tests']['control NDWI level']['pooled_lead'] < -0.001
          and s['results'][a]['test']['tests']['control NDWI level']['l'] > s['results'][a]['test']['tests']['control NDWI level']['w'] for a in ('B_v1', 'C_v1_2'))
      and all(s['results'][a]['bolivia']['tests']['control NDWI level']['pooled_lead'] > 0 for a in ('B_v1', 'C_v1_2'))
      and s['results']['A_olmoearth_base']['matched']['tests']['control NDWI level']['pooled_lead'] < -0.001
      and s['results']['A_olmoearth_base']['matched']['tests']['control NDWI level']['l'] > s['results']['A_olmoearth_base']['matched']['tests']['control NDWI level']['w']
    )(A['exp/out/exp51_summary.json'])
  cited_in:
    - {file: docs/Findings.md, marker: s1-probe-ndwi-flip}
    - {file: docs/TECHNIQUES.md, marker: s1-probe-ndwi-flip}
    - {file: docs/results/comparisons.md, marker: s1-probe-ndwi-flip}

- id: cross-encoder-phi-on-their-embeddings
  statement: On Ai2's published Sen1Floods11 embeddings with their probe, six of seven other encoders share OlmoEarth Base's error windows at phi 0.78-0.82 and Satlas (2 x 2 token grid) at 0.62; exp41's shared-error result replicates on their sensor and readout.
  status: measured
  experiments: [exp51, exp41]
  artifacts: [exp/out/exp51_summary.json]
  check: |-
    (lambda ph:
      all(0.77 <= ph[k]['phi'] <= 0.83 for k in ('galileo_base', 'croma_base', 'terramind_base', 'clay_large', 'anysat', 'panopticon'))
      and 0.55 <= ph['satlas_base']['phi'] <= 0.70
      and all(ph[k]['aligned_tiles'] == 2419 for k in ph)
    )(A['exp/out/exp51_summary.json']['phi_vs_olmoearth_base'])
  cited_in:
    - {file: docs/Findings.md, marker: cross-encoder-phi-on-their-embeddings}
    - {file: docs/TECHNIQUES.md, marker: cross-encoder-phi-on-their-embeddings}
    - {file: docs/results/comparisons.md, marker: cross-encoder-phi-on-their-embeddings}

- id: encode-path-reproduces-their-probe
  statement: Ai2's probe on their own OlmoEarth Base embeddings reaches mIoU 0.789 against the paper's 79.2, and our Sentinel-1 encode of the same model with the same probe agrees with it window for window (phi 0.937 on 2,419 matched test tiles, accuracies within 0.002 on the shared block).
  status: measured
  experiments: [exp51]
  artifacts: [exp/out/exp51_summary.json]
  check: |-
    (lambda a:
      round(a['pixel_miou'], 3) == 0.789 and a['matched_tiles'] == 2419 and a['matched']['phi_vs_arm_B_v1'] > 0.9
      and abs(a['matched']['acc_arm_A_on_shared'] - a['matched']['acc_arm_B_on_shared']) < 0.002
    )(A['exp/out/exp51_summary.json']['results']['A_olmoearth_base'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: encode-path-reproduces-their-probe}
    - {file: docs/results/comparisons.md, marker: encode-path-reproduces-their-probe}

- id: finetune-corrects-frozen-errors
  statement: Fine-tuning OlmoEarth Base on Sen1Floods11 with Ai2's recipe corrects at least 40% of the frozen head's shift-averaged errors on both testbeds (66% Bolivia, 44% multi-region under v1) and lifts window accuracy from 0.917 / 0.955 to 0.954 / 0.967 (preregistered P2).
  status: supported
  experiments: [exp52]
  artifacts: [exp/out/exp52_summary.json]
  check: |-
    (lambda s, r:
      s['prereg']['P2'] is True and s['prereg']['complete'] is True
      and all(r[n]['vs_frozen_head']['share_corrected'] >= 0.40 and r[n]['vs_frozen_head']['corrected'] > r[n]['vs_frozen_head']['broken'] for n in ('bolivia', 'test'))
      and round(r['bolivia']['vs_frozen_head']['share_corrected'], 2) == 0.66 and round(r['test']['vs_frozen_head']['share_corrected'], 2) == 0.44
      and all(r[n]['window_accuracy'] > r[n]['frozen_window_accuracy'] + 0.01 for n in ('bolivia', 'test'))
    )(A['exp/out/exp52_summary.json'], A['exp/out/exp52_summary.json']['results']['FT-S2 v1'])
  cited_in:
    - {file: docs/Findings.md, marker: finetune-corrects-frozen-errors}
    - {file: docs/TECHNIQUES.md, marker: finetune-corrects-frozen-errors}
    - {file: docs/results/comparisons.md, marker: finetune-corrects-frozen-errors}

- id: finetune-dissolves-bolivia-exception
  statement: The fine-tuned S2 model's own confidence beats the no-model NDWI-level control on Bolivia under both backbones (preregistered P1), so the Bolivia exception belonged to the frozen encoder; on the multi-region split it ties pooled under v1 while winning per tile, and beats it under v1.2.
  status: supported
  experiments: [exp52]
  artifacts: [exp/out/exp52_summary.json]
  check: |-
    (lambda s, R:
      s['prereg']['P1'] is True
      and all(R[a]['bolivia']['tests']['control NDWI level']['pooled_lead'] >= 0.001 and R[a]['bolivia']['tests']['control NDWI level']['sign_p'] < 0.05 for a in ('FT-S2 v1', 'FT-S2 v1_2'))
      and abs(R['FT-S2 v1']['test']['tests']['control NDWI level']['pooled_lead']) < 0.001 and R['FT-S2 v1']['test']['tests']['control NDWI level']['w'] > 3 * R['FT-S2 v1']['test']['tests']['control NDWI level']['l']
      and R['FT-S2 v1_2']['test']['tests']['control NDWI level']['pooled_lead'] >= 0.001
    )(A['exp/out/exp52_summary.json'], A['exp/out/exp52_summary.json']['results'])
  cited_in:
    - {file: docs/Findings.md, marker: finetune-dissolves-bolivia-exception}
    - {file: docs/TECHNIQUES.md, marker: finetune-dissolves-bolivia-exception}
    - {file: docs/results/comparisons.md, marker: finetune-dissolves-bolivia-exception}

- id: s1-adds-little-after-finetune
  statement: Adding Sentinel-1 to the fine-tuned Sentinel-2 model adds at most 0.1 window-accuracy points; fine-tuned Sentinel-1 alone stays below the frozen S2 head and the NDWI index still out-ranks its confidence on the multi-region split, so exp46's sensor lever is a frozen-feature property.
  status: measured
  experiments: [exp52, exp46]
  artifacts: [exp/out/exp52_summary.json]
  check: |-
    (lambda R:
      all(0 <= R['FT-S1+S2 v1'][n]['window_accuracy'] - R['FT-S2 v1'][n]['window_accuracy'] <= 0.001 for n in ('bolivia', 'test'))
      and all(R['FT-S1 v1'][n]['window_accuracy'] < R['FT-S1 v1'][n]['frozen_window_accuracy'] for n in ('bolivia', 'test'))
      and R['FT-S1 v1']['test']['pooled_eaurc']['control NDWI level'] < R['FT-S1 v1']['test']['pooled_eaurc']['averaged confidence']
    )(A['exp/out/exp52_summary.json']['results'])
  cited_in:
    - {file: docs/Findings.md, marker: s1-adds-little-after-finetune}
    - {file: docs/TECHNIQUES.md, marker: s1-adds-little-after-finetune}
    - {file: docs/results/comparisons.md, marker: s1-adds-little-after-finetune}

- id: shift-tta-rejected
  statement: Adapting the head per tile so the four tilings agree (memo or consistency objective, anchored, stopped on held-out tilings) lowers hand-label pixel accuracy on both testbeds while held-out agreement improves on 96-99% of tiles; preregistered P1 fails.
  status: rejected
  experiments: [exp53]
  artifacts: [exp/out/exp53_summary.json]
  check: |-
    (lambda s, R:
      s['prereg']['P1'] is False and s['prereg']['complete'] is True
      and all(R[n][v]['mean_gain'] < 0 and R[n][v]['sign_p'] > 0.05 and R[n][v]['share_tiles_held_out_improved'] >= 0.95 for n in ('bolivia', 'test') for v in ('memo', 'consistency'))
    )(A['exp/out/exp53_summary.json'], A['exp/out/exp53_summary.json']['results'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: shift-tta-rejected}
    - {file: docs/results/comparisons.md, marker: shift-tta-rejected}

- id: audit-does-not-save-labels
  statement: Choosing fine-tuning tiles by the audit's suspicion (low-confidence or boundary windows under the frozen head) is worse than random selection on the multi-region test split at every budget from 100 to 1,000 labels and never reaches random's 1,000-label accuracy; entropy selection is worse still; preregistered P1 and P2 fail.
  status: rejected
  experiments: [exp56]
  artifacts: [exp/out/exp56_summary.json]
  check: |-
    (lambda s, A:
      s['prereg']['P1'] is False and s['prereg']['P2'] is False and s['prereg']['complete'] is True
      and all(v < 0 for v in s['prereg']['P1_detail']['per_seed_lead'].values())
      and all(A['audit'][b]['test']['mean'] < A['random'][b]['test']['mean'] for b in ('100', '300', '500', '1000'))
      and all(A['entropy'][b]['test']['mean'] < A['random'][b]['test']['mean'] for b in ('100', '300', '500', '1000'))
      and s['labels_to_parity']['audit'] is None and s['labels_to_parity']['entropy'] is None
      and all(A[st][b]['selected_frozen_error_rate_mean'] > 2.5 * A['random'][b]['selected_frozen_error_rate_mean'] for st in ('audit', 'entropy') for b in ('100', '300', '500', '1000'))
    )(A['exp/out/exp56_summary.json'], A['exp/out/exp56_summary.json']['aggregate'])
  cited_in:
    - {file: docs/Findings.md, marker: audit-does-not-save-labels}
    - {file: docs/TECHNIQUES.md, marker: audit-does-not-save-labels}
    - {file: docs/results/comparisons.md, marker: audit-does-not-save-labels}

- id: multiclass-confidence-beats-embedding-control
  statement: On MADOS (15 classes), PASTIS (19, S2 and S1+S2), m_cashew_plant (7) and m_sa_crop_type (10) from Ai2's published embeddings, OlmoEarth Base's probe confidence beats the embedding-distance control by 0.03-0.21 excess AURC with per-tile p < 0.05 on every task (preregistered P1).
  status: supported
  experiments: [exp54]
  artifacts: [exp/out/exp54_summary.json]
  check: |-
