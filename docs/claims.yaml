- id: boundary-first-many-classes-split
  statement: At 15-19 classes the boundary-first order captures slightly fewer errors than confidence, or as many, at the 5% budget pooled over windows, while winning the per-tile sign test on four of six PASTIS encoders, on cashew (34/6) and on SA crop type (647/196).
  status: measured
  experiments: [exp54]
  artifacts: [exp/out/exp54_summary.json]
  check: |-
    (lambda r:
      all(x['boundary_first_vs_confidence']['0.05']['pooled_boundary_first'] <= x['boundary_first_vs_confidence']['0.05']['pooled_confidence'] + 0.001 for t in r for m, x in r[t].items() if m != 'phi_vs_olmoearth_base')
      and sum(1 for m, x in r['pastis_sentinel2'].items() if m != 'phi_vs_olmoearth_base' and x['boundary_first_vs_confidence']['0.05']['sign_p'] < 0.05 and x['boundary_first_vs_confidence']['0.05']['w'] > x['boundary_first_vs_confidence']['0.05']['l']) >= 4
      and (r['m_cashew_plant']['olmoearth_base']['boundary_first_vs_confidence']['0.05']['w'], r['m_cashew_plant']['olmoearth_base']['boundary_first_vs_confidence']['0.05']['l']) == (34, 6)
      and (r['m_sa_crop_type']['olmoearth_base']['boundary_first_vs_confidence']['0.05']['w'], r['m_sa_crop_type']['olmoearth_base']['boundary_first_vs_confidence']['0.05']['l']) == (647, 196)
    )(A['exp/out/exp54_summary.json']['results'])
  cited_in:
    - {file: docs/Findings.md, marker: boundary-first-many-classes-split}
    - {file: docs/TECHNIQUES.md, marker: boundary-first-many-classes-split}
    - {file: docs/results/comparisons.md, marker: boundary-first-many-classes-split}

- id: geoid-exception-rate
  statement: Over 45 scored GEOID-Flood events the NDWI index beats the S2 head's confidence on 2 events for permanent water and the sensor-level control beats the S1 head's confidence on 1 for post-event water (preregistered P1 and P2); Bolivia-type exceptions exist and are rare.
  status: supported
  experiments: [exp55]
  artifacts: [exp/out/exp55_summary.json]
  check: |-
    (lambda s, R:
      s['prereg']['P1'] is True and s['prereg']['P2'] is True and s['prereg']['complete'] is True
      and R['A']['across_events']['control NDWI level']['control_wins'] == 2 and R['A']['across_events']['n_events_scored'] == 45
      and R['B']['across_events']['control S1 level']['control_wins'] == 1
      and R['A']['across_events']['control NDWI level']['exception_rate'] < 1 / 3
    )(A['exp/out/exp55_summary.json'], A['exp/out/exp55_summary.json']['results'])
  cited_in:
