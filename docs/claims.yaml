  artifacts: [exp/out/exp51_summary.json]
  check: |-
    (lambda s, p:
      s['prereg']['P2'] is False and p['lead_v1_2_minus_v1'] >= 0.001 and p['sign_p'] >= 0.05
      and (p['w_v1_better'], p['l']) == (173, 152)
      and round(p['pooled_eaurc_v1'], 4) == 0.0214 and round(p['pooled_eaurc_v1_2'], 4) == 0.0241
      and s['results']['C_v1_2']['bolivia']['accuracy'] < s['results']['B_v1']['bolivia']['accuracy']
      and s['results']['C_v1_2']['test']['accuracy'] > s['results']['B_v1']['test']['accuracy']
