      and all(min(float(r['aurc']) for r in c if r['scene'] == s and r['signal'] in m) < min(float(r['aurc']) for r in c if r['scene'] == s and r['signal'] in n) for s in ('kazungula', 'hard_barotse'))
      and {r['scene'] for r in c} == {'kazungula', 'hard_barotse', 'ood_delta'}
