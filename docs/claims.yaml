- id: atlas-disagreement-is-boundary-located
  statement: On the disagreement windows of every pair of inferences (crop offsets 0 vs 2, v1 vs v1.2, the S2 head vs the S1 head and frozen vs fine-tuned on both Sen1Floods11 testbeds; seven encoders against OlmoEarth Base on Ai2's embeddings; the two sensors on the median GEOID-Flood event) the boundary cue is enriched more than twofold, 3.3x to 7.1x on Sen1Floods11 and 21x on the median GEOID event (preregistered P1, 16 of 16 pairs).
  status: supported
  experiments: [exp57]
  artifacts: [exp/out/exp57_summary.json]
  check: |-
    (lambda s, g, d:
      s['prereg']['P1'] is True and s['prereg']['complete'] is True
      and s['prereg']['P1_n_tested'] == 16 and len(d) == 16
      and all(v > 2 for v in d.values()) and min(d.values()) > 3.3
      and round(min(v for k, v in d.items() if not k.startswith('geoid')), 1) == 3.3
      and round(max(v for k, v in d.items() if not k.startswith('geoid')), 1) == 7.1
      and d['geoid/median event'] > 20 and round(g['across_events']['boundary_enrichment']['q50']) == 21
    )(A['exp/out/exp57_summary.json'], A['exp/out/exp57_summary.json']['results']['geoid'], A['exp/out/exp57_summary.json']['prereg']['P1_detail'])
  cited_in:
