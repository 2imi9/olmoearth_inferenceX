- id: dfc2020-coarse-reference-penalises-the-boundary-order
  statement: "Graded against DFC2020's 500 m MODIS reference instead of its 10 m one, the boundary-first order falls further behind the model's margin, not closer: it trails by 0.0453, 0.1198 and 0.0409 against the 10 m reference and by 0.0766, 0.1351 and 0.0822 against the 500 m one, so the gap is negative on all three arms (-0.0313, -0.0153, -0.0413); preregistered P3, which predicted the weaker reference would flatter the boundary order as WorldCover did in exp18, fails. The reading: a reference flatters a boundary-shaped signal only when it resolves boundaries at a scale comparable to the prediction's, and a reference twenty times coarser penalises it."
