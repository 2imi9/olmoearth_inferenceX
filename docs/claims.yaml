    - {file: docs/TECHNIQUES.md, marker: atlas-different-differences}
    - {file: docs/results/comparisons.md, marker: atlas-different-differences}

- id: atlas-which-side
  statement: "Where two inferences disagree, the label says which is right only for the differences that changed the model: the fine-tuned model is right on 75% / 71% (Bolivia / test) of its disagreements with the frozen head and the S2 head on 67% / 84% of its disagreements with the S1 head, while under crop offsets and the two backbones either side is right on 39-61% of theirs and OlmoEarth Base is right on 47-56% of its disagreements with six of the seven encoders (71% against Satlas)."
  status: measured
  experiments: [exp57]
  artifacts: [exp/out/exp57_summary.json]
  check: |-
    (lambda r, E, six=('galileo_base', 'croma_base', 'terramind_base', 'clay_large', 'anysat', 'panopticon'):
      round(r['finetune']['bolivia']['graded']['which_side']['share_b_right'], 2) == 0.75
      and round(r['finetune']['test']['graded']['which_side']['share_b_right'], 2) == 0.71
      and round(r['sensors']['bolivia']['graded']['which_side']['share_a_right'], 2) == 0.67
      and round(r['sensors']['test']['graded']['which_side']['share_a_right'], 2) == 0.84
      and sorted(round(x['graded']['which_side'][k], 2) for x in (r['offsets']['bolivia']['offsets 0 vs 2'], r['offsets']['test']['offsets 0 vs 2'], r['backbones']['bolivia'], r['backbones']['test']) for k in ('share_a_right', 'share_b_right'))[::7] == [0.39, 0.61]
      and sorted(round(E[m]['graded']['which_side']['share_a_right'], 2) for m in six)[::5] == [0.47, 0.56]
      and round(E['satlas_base']['graded']['which_side']['share_a_right'], 2) == 0.71
    )(A['exp/out/exp57_summary.json']['results'], A['exp/out/exp57_summary.json']['results']['encoders'])
  cited_in:
