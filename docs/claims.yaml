      s['prereg']['P1'] is True and s['prereg']['complete'] is True and len(s['prereg']['P1_per_task']) == 5
      and all(s['results'][t]['olmoearth_base']['tests']['control embedding distance']['pooled_lead'] >= 0.03 and s['results'][t]['olmoearth_base']['tests']['control embedding distance']['sign_p'] < 0.05 for t in s['results'])
    )(A['exp/out/exp54_summary.json'])
  cited_in:
