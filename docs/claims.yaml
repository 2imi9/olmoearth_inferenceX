    - {file: docs/TECHNIQUES.md, marker: geoid-exception-rate}
    - {file: docs/results/comparisons.md, marker: geoid-exception-rate}

- id: geoid-capture-effect-size
  statement: On the median GEOID-Flood event the 5% of windows confidence flags hold 88% of the permanent-water errors and 64% of the post-event water errors, 17.5 and 12.8 times a random 5% (preregistered P3, threshold 0.25).
  status: supported
  experiments: [exp55]
  artifacts: [exp/out/exp55_summary.json]
  check: |-
    (lambda s, R:
      s['prereg']['P3'] is True
      and all(R[t]['across_events']['median_capture5_confidence'] >= 0.25 and R[t]['across_events']['median_capture5_ratio_to_random'] >= 5 for t in ('A', 'B'))
      and round(R['A']['across_events']['median_capture5_confidence'], 2) == 0.88 and round(R['B']['across_events']['median_capture5_confidence'], 2) == 0.64
    )(A['exp/out/exp55_summary.json'], A['exp/out/exp55_summary.json']['results'])
  cited_in:
