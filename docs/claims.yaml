- id: tool-vs-diff-resolution
  statement: "Believing the side with the larger margin is right on more disagreement windows than a coin flip on every pair (51-70% pooled; one-sided per-tile sign tests p <= 0.03 on all 15), but the preregistered 55% is missed on the Bolivia crop offsets (51%) and three encoders (Galileo, TerraMind and AnySat, 54-55%), and wherever one side is known to be better the rule falls short of always choosing it (the S2 head is right on 84% of the test-split disagreements against the rule's 70%; the fine-tuned model on 75% / 72% (Bolivia / test) against 61% / 55%); P1 fails."
  status: mixed
  experiments: [exp58]
  artifacts: [exp/out/exp58_summary.json]
  check: |-
    (lambda s, d, r:
      s['prereg']['P1'] is False and s['prereg']['n_tested'] == 15 and len(d) == 15
      and all(v['resolution_p'] < 0.05 and 0.51 <= v['share_right'] <= 0.70 for v in d.values())
      and max(v['resolution_p'] for v in d.values()) <= 0.03
      and round(min(v['share_right'] for v in d.values()), 2) == 0.51 and round(max(v['share_right'] for v in d.values()), 2) == 0.70
      and d['offsets/bolivia']['share_right'] < 0.55
      and sorted(k for k, v in d.items() if v['share_right'] < 0.55) == ['encoders/anysat', 'encoders/galileo_base', 'encoders/terramind_base', 'offsets/bolivia']
      and r['sensors']['test']['resolution']['always_a'] > r['sensors']['test']['resolution']['share_right'] + 0.1
      and round(r['sensors']['test']['resolution']['always_a'], 2) == 0.84 and round(r['sensors']['test']['resolution']['share_right'], 2) == 0.70
      and all(r['finetune'][t]['resolution']['always_b'] > r['finetune'][t]['resolution']['share_right'] + 0.1 for t in ('bolivia', 'test'))
      and round(r['finetune']['bolivia']['resolution']['always_b'], 2) == 0.75 and round(r['finetune']['test']['resolution']['always_b'], 2) == 0.72
      and round(r['finetune']['bolivia']['resolution']['share_right'], 2) == 0.61 and round(r['finetune']['test']['resolution']['share_right'], 2) == 0.55
    )(A['exp/out/exp58_summary.json'], A['exp/out/exp58_summary.json']['prereg']['detail'], A['exp/out/exp58_summary.json']['results'])
  cited_in:
