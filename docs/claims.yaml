      and all(s['results'][v][n]['pooled_eaurc'][k] > 2.9 * s['results'][v][n]['pooled_eaurc']['averaged confidence'] for v in ('v1', 'v1_2') for n in ('bolivia', 'test') for k in ('embedding normalized distance', 'embedding NCDD', 'input extremity max', 'input extremity mean'))
      and all(s['results'][v]['bolivia']['tile_level']['per_ranker']['ensemble mutual information']['aurc'] > s['results'][v]['bolivia']['tile_level']['per_ranker']['averaged confidence']['aurc'] for v in ('v1', 'v1_2'))
    )(A['exp/out/exp49_summary.json'])
  cited_in:
