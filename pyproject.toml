[project]
name = "olmoearth-inferencex"
version = "1.1.2"
description = "Label-free audit of Earth-observation prediction maps: which windows to review first, why, and how two inferences differ"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Ziming Qi" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["earth-observation", "remote-sensing", "selective-classification", "error-ranking", "OlmoEarth", "audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
]


# Core: the assessment layer (oe_inferencex.assess / metrics / taskcard / lcc).
# Deliberately free of torch and of olmoearth-pretrain, so the OlmoEarth Agent
# can install this package without the encoder stack. See
# docs/method/agent_integration.md.
dependencies = [
    "numpy>=1.26.4",
    "pyyaml>=6.0",            # oe_inferencex.taskcard reads project model.yaml
    "huggingface_hub>=0.20",  # oe_inferencex.taskcard resolves encoder configs
]

[project.scripts]
oe-inferencex = "oe_inferencex.cli:main"

[project.urls]
Documentation = "https://olmoearth-inferencex.readthedocs.io"
Repository = "https://github.com/2imi9/olmoearth_inferenceX"
Changelog = "https://github.com/2imi9/olmoearth_inferenceX/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The encoder stack. Needed by oe_inferencex.{awf,data} and by 22 of the 27
# experiment scripts; pulls torch, einops and universal-pathlib transitively.
# To reproduce against a specific upstream revision instead of the release,
# install a checkout over the top:  uv pip install -e ../olmoearth_pretrain
encoder = [
    "olmoearth-pretrain>=0.1,<0.2",
    # declared directly so the [tool.uv.sources] index pin below applies to it
    # (uv only honours source overrides for direct dependencies)
    "torch>=2.7,<2.8",
]

# Geospatial IO and plotting, for the experiment scripts.
geo = [
    "rasterio>=1.4",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[dependency-groups]
# `uv run pytest`: the assessment layer against the recorded numbers in exp/out (encoder-free);
# the equality checks against the experiment modules run only when the encoder extra is installed.
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oe_inferencex*"]

# The real map `oe-inferencex demo` audits (about 250 KB) and its notice.
[tool.setuptools.package-data]
oe_inferencex = ["sample/*"]

# Torch index pinning. These were previously inherited from the sibling
# olmoearth_pretrain checkout; declaring them here keeps resolution identical
# without requiring that checkout to exist. Linux gets the cu128 build (the
# GPU experiments); every other platform gets the CPU build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
