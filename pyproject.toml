[project]
name = "olmoearth-inferencex"
version = "0.1.0"
description = "Audit system for OlmoEarth inference quality over unlabeled regions"
requires-python = ">=3.11,<3.14"
dependencies = [
    "olmoearth-pretrain",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.4",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oe_inferencex*"]

[tool.uv.sources]
olmoearth-pretrain = { path = "../olmoearth_pretrain", editable = true }
