site_name: olmoearth_inferenceX
site_description: Label-free auditing of OlmoEarth inference results
site_url: https://olmoearth-inferencex.readthedocs.io/
repo_url: https://github.com/2imi9/olmoearth_inferenceX
repo_name: 2imi9/olmoearth_inferenceX
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  figures/*.py
  requirements.txt
  gen_pages.py
  hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Findings: Findings.md
  - Usage: Usage.md
  - Recipe: method/recipe.md
  - Technique ledger: TECHNIQUES.md
  - Protocol: method/protocol.md
  - Results:
      - Explanation: results/explanation.md
      - Signals: results/signals.md
      - Comparisons: results/comparisons.md
  - Method:
      - Agent integration: method/agent_integration.md
      - Task cards: method/taskcards.md
      - Infrastructure: method/infrastructure.md
  - Roadmap: plan/roadmap.md
  - Lab log: LabLog.md
  - API reference: API.md

hooks:
  - docs/hooks.py

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
