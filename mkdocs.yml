site_name: olmoearth_inferenceX
site_description: Label-free audit of OlmoEarth inference maps, which windows to review first, why each is suspect, and what comparing inferences across crops, backbones and sensors says about where the errors come from
site_url: https://olmoearth-inferencex.readthedocs.io/
repo_url: https://github.com/2imi9/olmoearth_inferenceX
repo_name: 2imi9/olmoearth_inferenceX
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  figures/*.py
  figures/tikz/
  __pycache__/
  requirements.txt
  gen_pages.py
  gen_api.py
  hooks.py

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Top-level entries with children become the tabs; the first page of a section is its landing page (section-index).
nav:
  - Home:
      - index.md
      - Findings: Findings.md
      - Recipe: method/recipe.md
  - Usage:
      - Usage.md
      - Agent integration: method/agent_integration.md
      - Task cards: method/taskcards.md
      - Infrastructure: method/infrastructure.md
  - Evidence:
      - Technique ledger: TECHNIQUES.md
      - Explanation: results/explanation.md
      - Signals: results/signals.md
      - Comparisons: results/comparisons.md
      - Lab log: LabLog.md
  - Protocol:
      - method/protocol.md
      - Claim ledger: method/claims.md
      - Roadmap: plan/roadmap.md
      - Paper outline: plan/paper_outline.md
      - Readout design theory (exp48 preregistration): plan/readout_design_theory.md
  - API Reference: reference/

hooks:
  - docs/hooks.py

plugins:
  - search
  - section-index
  - gen-files:
      scripts:
        - docs/gen_pages.py
        - docs/gen_api.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
