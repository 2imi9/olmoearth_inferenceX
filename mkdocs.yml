site_name: olmoearth_inferenceX
site_description: A Python package for assessing Earth-observation classification maps. It ranks map windows by model confidence for manual review, compares two maps of the same area, and estimates error rates and per-class accuracy from a labelled sample.
site_url: https://olmoearth-inferencex.readthedocs.io/
repo_url: https://github.com/2imi9/olmoearth_inferenceX
repo_name: 2imi9/olmoearth_inferenceX
edit_uri: edit/main/docs/

# --strict on its own does not catch a link to an anchor that does not exist: mkdocs logs that at INFO and the
# build stays green. Raising it to a warning is what makes the docs job of .github/workflows/check.yml able to
# fail.
validation:
  anchors: warn
  unrecognized_links: warn

docs_dir: docs
exclude_docs: |
  __pycache__/
  requirements.txt
  gen_api.py

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Top-level entries become the tabs; the first page of a section is its landing page (section-index). The evidence
# pages, the lab log and the technical report moved to the research record on 14 October 2026; the last tab links
# there.
nav:
  - Home: index.md
  - Usage: Usage.md
  - API Reference: reference/
  - Research record: https://github.com/2imi9/olmoearth_inferenceX-record

plugins:
  - search
  - section-index
  # The pages that moved to the research record, so that links to them (among them the Findings URL that
  # `oe-inferencex demo` printed up to 1.12.1) land on the moved page instead of a 404.
  - redirects:
      redirect_maps:
        Summary.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/Summary.md
        Findings.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/Findings.md
        method/recipe.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/method/recipe.md
        related_work.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/related_work.md
        method/agent_integration.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/method/agent_integration.md
        method/taskcards.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/method/taskcards.md
        method/infrastructure.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/method/infrastructure.md
        TECHNIQUES.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/TECHNIQUES.md
        results/explanation.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/results/explanation.md
        results/signals.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/results/signals.md
        results/comparisons.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/results/comparisons.md
        testbeds.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/testbeds.md
        method/protocol.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/method/protocol.md
        method/claims.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/method/claims.md
        plan/index.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/docs/plan/index.md
        LabLog.md: https://github.com/2imi9/olmoearth_inferenceX-record/blob/main/exp/NOTES.md
  - gen-files:
      scripts:
        - docs/gen_api.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
